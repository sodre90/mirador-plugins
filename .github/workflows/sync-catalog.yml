name: Sync the catalog with its plugins

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: sync-catalog

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun test scripts
      - name: Pin each plugin's newest release and take its page from it
        id: sync
        run: bun scripts/sync-catalog.ts > "$RUNNER_TEMP/changes.md" || echo "unreadable=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet index.json && exit 0
          {
            echo "Moves the pins to the plugins' new releases, and takes each one's page from its plugin.json:"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "Merging lets each new release reach every Mirador that has the plugin, where its host code runs with all of Mirador's access: read the code each link shows first. Read the taglines too: those of plugins a user hasn't installed go into their agents' prompts."
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c catalog-sync
          git commit -m "Plugins… installs and updates the plugins' new releases, as reviewed here" index.json
          git push --force origin catalog-sync
          open_or_update_pull_request() {
            if [ "$(gh pr view catalog-sync --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
              gh pr edit catalog-sync --body-file "$RUNNER_TEMP/body.md"
            else
              gh pr create --head catalog-sync --title "Plugins… installs and updates the plugins' new releases, as reviewed here" --body-file "$RUNNER_TEMP/body.md"
            fi
          }
          open_or_update_pull_request ||
            { sleep 15; open_or_update_pull_request; } ||
            { sleep 60; open_or_update_pull_request; }
      - name: Fail when a pinned tag moved or a plugin couldn't be read
        if: always() && steps.sync.outputs.unreadable == 'true'
        run: exit 1
